# =============================================================
#  CTI Lab — site configuration
#  Folder layout follows the academicpages template convention.
#  Restart `bundle exec jekyll serve` after editing this file.
# =============================================================

# ---------- Basic site settings ----------
title            : "CTI Lab"
subtitle         : "Cyber Threat Intelligence Lab"
description      : >-
  Cyber Threat Intelligence Lab (CTI Lab) studies software security, cyber threat
  intelligence, and privacy protection on the web.

# TODO: replace with your own institution
institution      : "Department of Cyber Space, Ajou University"
institution_url  : "https://security.ajou.ac.kr/security/index.do"

# TODO: for a user site use https://<username>.github.io and leave baseurl empty.
#       for a project site use baseurl: "/<repo-name>"
url              : "https://bjjine.github.io"
baseurl          : ""
repository       : "BJJINE/BJJINE.github.io"

logo             : "/images/logo.svg"        # full lockup, used on the home page
logo_mark        : "/images/logo-mark.svg"   # shield only, used in the navbar
favicon          : "/images/logo-mark.svg"

# ---------- Lab contact (used on the Contact page and in the footer) ----------
email            : "jinbumjin@ajou.ac.kr"          # TODO
address          : "Room 517, 206 Worldcup-ro, Yeongtong-gu, Suwon-si, Gyeonggi-do, 16499, Korea"  # TODO
map_query        : "아주대학교 산학협력원" # TODO: used for the Google Maps embed

# ---------- Social / academic links (leave blank to hide) ----------
googlescholar    : "https://scholar.google.com/citations?user=2VVd5HEAAAAJ"
github           : ""
twitter          : ""
linkedin         : ""

# ---------- Build settings ----------
markdown         : kramdown
highlighter      : rouge
permalink        : /:categories/:title/
timezone         : Asia/Seoul

include:
  - _pages

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - node_modules

plugins:
  - jekyll-feed
  - jekyll-sitemap

# ---------- Collections ----------
collections:
  publications:
    output: true
    permalink: /publication/:path/

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: page
  - scope:
      path: ""
      type: publications
    values:
      layout: publication

sass:
  sass_dir: _sass
  style: compressed
