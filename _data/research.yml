# Research areas shown on the home page.
# `icon` is any single character or emoji; swap for an <img> in
# _pages/about.md if you prefer real icons.

- icon: "◈"
  title: "Threat Intelligence"
  text: >-
    Collecting and structuring threat data from OSINT and underground sources,
    and standardizing it with STIX/TAXII for automated sharing.

- icon: "⌁"
  title: "Threat Actor Attribution"
  text: >-
    Profiling APT campaigns through TTP analysis and linking observed activity
    to known adversary groups.

- icon: "☍"
  title: "Dark Web Monitoring"
  text: >-
    Tracking underground forums and marketplaces to detect leaked credentials
    and early indicators of attack.

- icon: "⚙"
  title: "Malware Analysis"
  text: >-
    Static and dynamic analysis of malicious binaries, automated family
    classification, and behavior-based detection.

- icon: "◇"
  title: "AI Security"
  text: >-
    Machine learning for anomaly, phishing, and intrusion detection — and the
    security of the machine learning models themselves.

- icon: "◎"
  title: "Vulnerability Research"
  text: >-
    Discovering and analyzing vulnerabilities in software and IoT systems, and
    studying exploitation trends in the wild.
