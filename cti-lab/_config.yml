# =============================================================
#  CTI Lab — site configuration
#  Folder layout follows the academicpages template convention.
#  Restart `bundle exec jekyll serve` after editing this file.
# =============================================================

# ---------- Basic site settings ----------
title            : "CTI Lab"
subtitle         : "Cyber Threat Intelligence Lab"
description      : >-
  Cyber Threat Intelligence Lab (CTI Lab) studies how to collect, analyze,
  and operationalize intelligence about real-world cyber threats.

# TODO: replace with your own institution
institution      : "Department of Computer Science and Engineering, OO University"
institution_url  : "https://www.university.ac.kr"

# TODO: for a user site use https://<username>.github.io and leave baseurl empty.
#       for a project site use baseurl: "/<repo-name>"
url              : "https://your-username.github.io"
baseurl          : ""
repository       : "your-username/your-username.github.io"

logo             : "/images/logo.svg"        # full lockup, used on the home page
logo_mark        : "/images/logo-mark.svg"   # shield only, used in the navbar
favicon          : "/images/logo-mark.svg"

# ---------- Lab contact (used on the Contact page and in the footer) ----------
email            : "cti-lab@university.ac.kr"          # TODO
phone            : "+82-2-000-0000"                    # TODO
address          : "Room 305, Engineering Building, 000 OO-ro, OO-gu, Seoul 00000, Republic of Korea"  # TODO
map_query        : "OO University Engineering Building" # TODO: used for the Google Maps embed

# ---------- Social / academic links (leave blank to hide) ----------
googlescholar    : "https://scholar.google.com/citations?user=XXXXXXXX"
github           : ""
twitter          : ""
linkedin         : ""

# ---------- Build settings ----------
markdown         : kramdown
highlighter      : rouge
permalink        : /:categories/:title/
timezone         : Asia/Seoul

include:
  - _pages

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - node_modules

plugins:
  - jekyll-feed
  - jekyll-sitemap

# ---------- Collections ----------
collections:
  publications:
    output: true
    permalink: /publication/:path/

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: page
  - scope:
      path: ""
      type: publications
    values:
      layout: publication

sass:
  sass_dir: _sass
  style: compressed
