---
layout: default
---
<article class="page container">
  {% unless page.hide_title %}
    <header class="page-head">
      <h1 class="page-title">{{ page.title }}</h1>
      {% if page.subtitle %}<p class="page-sub">{{ page.subtitle }}</p>{% endif %}
    </header>
  {% endunless %}

  <div class="page-body">
    {{ content }}
  </div>
</article>
