# Research areas shown on the home page.
#   icon   : any single character or emoji
#   text   : one-sentence summary of the area
#   topics : the concrete sub-topics listed under the area
# Add or remove entries freely — the grid reflows automatically.

- icon: "⚙"
  title: "Software Security"
  text: >-
    Analyzing malicious software and turning that analysis into detection
    that holds up against evolving samples.
  topics:
    - name: "Malware variant generation"
      text: "Identifying and classifying variants of known malware families."
    - name: "YARA rule generation"
      text: "Generating and evaluating rules that generalize beyond a single sample."

- icon: "◈"
  title: "Cyber Threat Intelligence (CTI)"
  text: >-
    Making threat data trustworthy and usable — from assessing the sources
    to delivering the finished report.
  topics:
    - name: "CTI data evaluation"
      text: "Assessing the quality, reliability, and timeliness of threat data."
    - name: "CTI report generation"
      text: "Turning analyzed intelligence into structured, actionable reports."

- icon: "☍"
  title: "Privacy Protection in Web"
  text: >-
    Studying how users are tracked and exposed on the web, and building
    defenses at the browser layer.
  topics:
    - name: "Ad/tracker detection & blocking"
      text: "Detecting advertising and tracking behavior, and blocking it effectively."
    - name: "Browser vulnerability"
      text: "Finding and analyzing vulnerabilities that undermine user privacy."
