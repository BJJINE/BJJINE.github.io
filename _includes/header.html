<header class="site-header">
  <div class="nav-wrap">

    <a class="brand" href="{{ '/' | relative_url }}">
      <img src="{{ site.logo_mark | relative_url }}" alt="{{ site.title }} logo">
      <span class="brand-text">
        {{ site.title }}
        <small>{{ site.subtitle }}</small>
      </span>
    </a>

    <button class="burger" id="burger" aria-label="Toggle navigation" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>

    <nav class="site-nav">
      <ul id="nav-list">
        {% for item in site.data.navigation.main %}
          {% assign target = item.url | relative_url %}
          <li>
            <a href="{{ target }}"
               {% if page.url == item.url %}class="active" aria-current="page"{% endif %}>
              {{ item.title }}
            </a>
          </li>
        {% endfor %}
      </ul>
    </nav>

  </div>
</header>
