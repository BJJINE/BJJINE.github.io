---
layout: default
---
<article class="page container">
  <header class="page-head">
    <p class="back-link"><a href="{{ '/publications/' | relative_url }}">&larr; Publications</a></p>
    <h1 class="page-title pub-detail-title">{{ page.title }}</h1>
    <p class="pub-detail-meta">
      {{ page.authors }}<br>
      <em>{{ page.venue }}</em>{% if page.year %}, {{ page.year }}{% endif %}
    </p>
    {% if page.links %}
      <div class="dl">
        {% for l in page.links %}<a href="{{ l.url }}">{{ l.label }}</a>{% endfor %}
      </div>
    {% endif %}
  </header>

  <div class="page-body">
    {{ content }}
  </div>

  {% if page.bibtex %}
    <h2 class="block">BibTeX</h2>
    <pre class="bibtex">{{ page.bibtex }}</pre>
  {% endif %}
</article>
